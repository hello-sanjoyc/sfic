<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#0b1f3a"/>

  <!-- Orange accent -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#ff9933" stroke-width="8"/>

  <!-- Green accent -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#138808" stroke-width="4"/>

  <!-- Blue accent -->
  <rect x="40" y="40" width="120" height="120" fill="none" stroke="#000080" stroke-width="4"/>

  <!-- Center element -->
  <circle cx="100" cy="100" r="30" fill="#ff9933"/>
  <text x="100" y="110" font-size="40" font-weight="bold" text-anchor="middle" fill="#0b1f3a" font-family="Arial">S</text>
</svg>
